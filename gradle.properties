# Project-wide Gradle settings.
# NOTE: Bubblewrap resets this to -Xmx1536m when it regenerates the project, which
# fails on this machine ("Could not reserve enough space for object heap").
# Build directly with `gradlew bundleRelease` (see README/notes) to keep this value.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
android.useAndroidX=true
